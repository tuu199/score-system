<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>尖刀排 · 学习积分系统</title>
  <link rel="stylesheet" href="css/style.css?v=56" />
  <script src="js/lib/supabase.min.js?v=56"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <!-- 顶部导航栏 -->
  <header class="app-header">
    <div class="brand">
      <span class="logo">🎯</span>
      <h1>尖刀排 · 学习积分系统</h1>
    </div>
    <nav id="nav" class="nav"><!-- 动态填充 --></nav>
    <div class="header-actions">
      <span id="mode-badge" class="mode-badge student">学生</span>
      <button id="btn-mode" class="btn btn-ghost btn-sm">管理员登录</button>
      <button id="btn-qrcode" class="btn btn-ghost btn-sm" title="扫码访问">📱</button>
      <button id="btn-export-json" class="btn btn-ghost btn-sm" title="导出数据为JSON文件">💾</button>
      <button id="btn-sync" class="btn btn-ghost btn-sm" title="刷新云端最新数据">🔄</button>
      <button id="btn-clear" class="btn btn-ghost btn-sm" title="清零所有积分和分享" style="display:none">🗑️</button>
    </div>
  </header>

  <!-- 消息提示 -->
  <div id="toast" class="toast hidden"></div>

  <!-- 管理员登录弹窗 -->
  <div id="login-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>🔐 管理员登录</h2>
      </div>
      <div class="modal-body">
        <p style="color:var(--text-soft);font-size:14px;margin-bottom:12px">请输入管理员密码</p>
        <input id="login-pwd" type="password" placeholder="密码" class="login-input"
               autocomplete="off" />
      </div>
      <div class="modal-footer">
        <button id="login-cancel" class="btn">取消</button>
        <button id="login-submit" class="btn btn-primary">登录</button>
      </div>
    </div>
  </div>

  <!-- 二维码弹窗 -->
  <div id="qrcode-modal" class="modal hidden">
    <div class="modal-content" style="width:340px;text-align:center">
      <div class="modal-header">
        <h2>📱 扫码访问</h2>
      </div>
      <div class="modal-body">
        <div id="qrcode-box" style="display:flex;justify-content:center;padding:10px"></div>
        <p style="margin-top:14px;font-size:14px;color:var(--text)">学生用手机微信/相机扫一扫即可打开本系统</p>
        <p id="qrcode-url" style="margin-top:6px;font-size:12px;color:var(--text-soft);word-break:break-all"></p>
      </div>
      <div class="modal-footer" style="justify-content:center">
        <button id="qrcode-copy" class="btn btn-primary btn-sm">复制网址</button>
        <button id="qrcode-close" class="btn btn-sm">关闭</button>
      </div>
    </div>
  </div>

  <!-- 主内容区 -->
  <main id="main" class="app-main">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>正在初始化数据库…</p>
    </div>
    <div id="view" class="view hidden"></div>
  </main>

  <!-- 手机端底部 Tab Bar -->
  <nav id="mobile-nav" class="mobile-nav"><!-- 动态填充 --></nav>

  <!-- 脚本加载（带版本号防缓存） -->
  <script src="js/utils.js?v=56"></script>
  <script src="js/db.js?v=56"></script>
  <script src="js/app.js?v=56"></script>
  <!-- 功能模块 -->
  <script src="js/modules/rules.js?v=56"></script>
  <script src="js/modules/groups.js?v=56"></script>
  <script src="js/modules/record.js?v=56"></script>
  <script src="js/modules/search.js?v=56"></script>
  <script src="js/modules/statistics.js?v=56"></script>
  <script src="js/modules/ranking.js?v=56"></script>
  <script src="js/modules/shares.js?v=56"></script>
  <script src="js/modules/gallery.js?v=56"></script>
  <script src="js/modules/docs.js?v=56"></script>
  <script src="js/modules/history.js?v=56"></script>

  <script>ScoreApp.init();</script>
</body>
</html>
